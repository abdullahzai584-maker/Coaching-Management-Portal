<html lang="en">
<head>

<style>

  --sh:0 8px 24px -4px rgba(15,23,42,.07),0 2px 6px -1px rgba(15,23,42,.04);
  --sh-lg:0 24px 50px -12px rgba(15,23,42,.22)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070b14;--card:rgba(15,23,42,.88);--card2:#162036;--ink:#f1f5f9;--mut:#94a3b8;--line:#1e293b;
  --pbg:rgba(99,102,241,.16);--onpri:#ffffff;
  --P:#34d399;--Pb:rgba(16,185,129,.16);--A:#fb7185;--Ab:rgba(244,63,94,.16);--L:#fbbf24;--Lb:rgba(245,158,11,.16);--V:#38bdf8;--Vb:rgba(14,165,233,.16);
  --sh:0 8px 28px rgba(0,0,0,.38);--sh-lg:0 24px 56px rgba(0,0,0,.65)
}}
:root[data-theme="dark"]{
  --bg:#070b14;--card:rgba(15,23,42,.88);--card2:#162036;--ink:#f1f5f9;--mut:#94a3b8;--line:#1e293b;
  --pbg:rgba(99,102,241,.16);--onpri:#ffffff;
  --P:#34d399;--Pb:rgba(16,185,129,.16);--A:#fb7185;--Ab:rgba(244,63,94,.16);--L:#fbbf24;--Lb:rgba(245,158,11,.16);--V:#38bdf8;--Vb:rgba(14,165,233,.16);

}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes tabEnter{0%{opacity:0;transform:translateY(12px) scale(.99)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes orbDrift1{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(42px,-30px,0) scale(1.12)}66%{transform:translate3d(-24px,26px,0) scale(.94)}}
@keyframes orbDrift2{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(-38px,28px,0) scale(1.1)}66%{transform:translate3d(30px,-22px,0) scale(.92)}}
@keyframes orbDrift3{0%,100%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(24px,24px,0) rotate(180deg)}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;width:100%;max-width:100%;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative}

#bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg-fx .grid-bg{position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--pri) 22%,transparent) 1px,transparent 1px);background-size:28px 28px;opacity:.45}
#bg-fx .orb{position:absolute;border-radius:50%;filter:blur(54px);opacity:.48;will-change:transform}
#bg-fx .o1{width:320px;height:320px;top:-60px;left:-50px;background:radial-gradient(circle,var(--pri),transparent 70%);animation:orbDrift1 14s ease-in-out infinite}
#bg-fx .o2{width:360px;height:360px;bottom:-80px;right:-60px;background:radial-gradient(circle,var(--P),transparent 70%);animation:orbDrift2 17s ease-in-out infinite}
#bg-fx .o3{width:240px;height:240px;top:42%;left:45%;background:radial-gradient(circle,var(--pri2),transparent 72%);opacity:.3;animation:orbDrift3 22s linear infinite}

#cursor-fx{display:none;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#cursor-fx .cur-aura{position:fixed;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pri) 26%,transparent),color-mix(in srgb,var(--pri2) 10%,transparent) 55%,transparent 72%);filter:blur(18px);opacity:0;transition:opacity .25s ease;will-change:transform}
#cursor-fx .cur-ring{position:fixed;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--pri) 55%,transparent);background:color-mix(in srgb,var(--pri) 6%,transparent);opacity:0;transition:opacity .25s ease;will-change:transform}
@media (hover:hover) and (pointer:fine){
  #cursor-fx{display:block}
}

#app,#m,#dr,#toast{position:relative;z-index:1}
#app{width:100%;max-width:100%;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;word-break:break-word}h1{font-size:21px}h2{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit;max-width:100%}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;transition:border-color .18s,box-shadow .18s,background .18s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pbg);background:var(--card)}
textarea{width:100%;min-height:90px}
.b{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:40px;transition:transform .14s,background .18s,border-color .18s,box-shadow .18s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap;flex-shrink:0}
.b:hover:not(:disabled){background:var(--pbg);border-color:var(--pri);transform:translateY(-1px)}
.b:active:not(:disabled){transform:translateY(0) scale(.98)}
.b.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border-color:transparent;box-shadow:0 6px 16px -4px var(--pri)}
.b.pri:hover:not(:disabled){opacity:.94;transform:translateY(-1px)}
.b.del{color:var(--A);border-color:rgba(225,29,72,.3)}.b.del:hover:not(:disabled){background:var(--Ab);border-color:var(--A)}
.b.sm{padding:6px 11px;min-height:34px;font-size:12.5px;border-radius:8px}
.b:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s;min-width:0;max-width:100%;overflow:hidden}
.card:hover{border-color:color-mix(in srgb,var(--pri) 35%,var(--line))}
.mut{color:var(--mut)}.sm{font-size:13px}
.lg{min-height:100dvh;width:100%;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at top right,var(--pbg),transparent 55%),var(--bg)}
.lg .card{width:100%;max-width:440px;display:grid;gap:12px;padding:20px;animation:popIn .28s ease}
.logo{font-weight:800;font-size:17px;letter-spacing:-.03em;color:var(--ink);display:inline-flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.logo span.brand-txt{background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.org-img{width:30px;height:30px;border-radius:9px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--pbg);color:var(--pri);white-space:nowrap;flex-shrink:0}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--P);display:inline-block;animation:pulseDot 2s infinite}
.sync.err i{background:var(--A);animation:none}
.ver-pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}

.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100dvh;width:100%;max-width:100%}
.shell > div{min-width:0;width:100%;max-width:100%}
.side{background:var(--card);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px}
.side .logo{padding:4px 10px 6px}
.side .tagline{padding:0 10px 12px;font-size:11.5px;color:var(--mut);line-height:1.35}
.nv{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mut);transition:all .16s;white-space:nowrap}
.nv.on{background:var(--pbg);color:var(--pri)}.nv:hover{color:var(--ink);background:var(--card2)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:10px 20px;width:100%;max-width:100%;min-width:0}
.top .sp{flex:1;min-width:0}.top input{width:200px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:4px 10px 4px 4px;flex-shrink:0;cursor:pointer;transition:border-color .16s,background .16s}
.chip:hover{border-color:var(--pri);background:var(--pbg)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg-av{width:68px;height:68px;font-size:24px;border:2px solid var(--line)}
.prof-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}
.role{font-size:11px;font-weight:700;background:var(--pbg);color:var(--pri);border-radius:6px;padding:2px 7px;text-transform:capitalize}
main{padding:20px;max-width:1160px;width:100%;min-width:0;animation:fadeUp .24s ease}
.tab-anim{animation:tabEnter .3s cubic-bezier(.22,1,.36,1)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;width:100%;min-width:0}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:16px;width:100%;min-width:0}
.kp .card{position:relative;overflow:hidden;animation:fadeUp .32s ease both}
.kp .card:nth-child(2){animation-delay:.04s}.kp .card:nth-child(3){animation-delay:.08s}.kp .card:nth-child(4){animation-delay:.12s}.kp .card:nth-child(5){animation-delay:.16s}.kp .card:nth-child(6){animation-delay:.2s}
.kp .card:hover{transform:translateY(-2px)}
.kp .card b{display:block;font-size:24px;font-weight:800;line-height:1.2;margin-top:4px;word-break:break-word}
.g2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;margin-bottom:14px;width:100%;min-width:0}
.bd{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.sP{background:var(--Pb);color:var(--P)}.sA{background:var(--Ab);color:var(--A)}.sL{background:var(--Lb);color:var(--L)}.sV{background:var(--Vb);color:var(--V)}.sN{background:var(--line);color:var(--mut)}
.ok{color:var(--P)}.bad{color:var(--A)}
.cnt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;width:100%}.cnt span{padding:5px 10px;border-radius:10px;font-weight:700;font-size:12px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;flex-wrap:wrap;box-shadow:var(--sh);transition:transform .15s,border-color .15s;width:100%;min-width:0}
.row:hover{border-color:var(--pri)}
.row .nm{flex:1;min-width:140px;cursor:pointer;word-break:break-word}.row .nm b{display:block;font-weight:600}
.seg{display:flex;gap:5px;flex-shrink:0}
.seg button{width:42px;height:38px;border:1px solid var(--line);background:var(--card2);border-radius:10px;cursor:pointer;font-weight:700;color:var(--mut);transition:all .14s}
.seg button:hover:not(:disabled){border-color:var(--pri);color:var(--ink)}
.seg .oP{background:var(--P);color:#fff;border-color:var(--P);box-shadow:0 4px 12px -2px var(--P)}
.seg .oA{background:var(--A);color:#fff;border-color:var(--A);box-shadow:0 4px 12px -2px var(--A)}
.seg .oL{background:var(--L);color:#fff;border-color:var(--L);box-shadow:0 4px 12px -2px var(--L)}
.seg .oV{background:var(--V);color:#fff;border-color:var(--V);box-shadow:0 4px 12px -2px var(--V)}
.mins{width:72px;padding:6px}
.tw{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;background:var(--card2)}
tr.cl{cursor:pointer;transition:background .14s}tr.cl:hover{background:var(--pbg)}
.mt{height:7px;background:var(--line);border-radius:999px;overflow:hidden;min-width:60px}.mt i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--P));border-radius:999px;transition:width .35s ease}.mt i.lo{background:var(--A)}
.al{border-radius:12px;padding:11px 14px;margin-bottom:12px;background:var(--Ab);color:var(--A);font-weight:600;border:1px solid rgba(225,29,72,.2);word-break:break-word}.al.w{background:var(--Lb);color:var(--L);border-color:rgba(180,83,9,.2)}
.dirty{color:var(--L);font-weight:700}
.emp{text-align:center;padding:24px 14px;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
.ov{position:fixed;inset:0;background:rgba(7,11,20,.65);backdrop-filter:blur(5px);display:grid;place-items:center;padding:12px;z-index:25}
.md{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:500px;max-height:88dvh;overflow:auto;display:grid;gap:12px;box-shadow:var(--sh-lg);animation:popIn .2s ease}
.md.w{max-width:680px}.mf{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--card);border-left:1px solid var(--line);z-index:15;padding:16px;overflow:auto;display:grid;gap:12px;align-content:start;box-shadow:var(--sh-lg);animation:slideLeft .22s ease}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:35;transition:opacity .2s;pointer-events:none;box-shadow:var(--sh-lg);max-width:calc(100vw - 24px);text-align:center;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.cal div{padding:7px 0;border-radius:9px;font-size:12px;font-weight:600;background:var(--card2)}
.fl{display:grid;gap:10px;min-width:0}.fl label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--mut);min-width:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s}
.sw:hover{transform:scale(1.1)}.sw.on{border-color:var(--ink);transform:scale(1.12)}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:var(--ink)}
.chk input{width:17px;height:17px;accent-color:var(--pri);flex-shrink:0}
.own-box{border:1px solid color-mix(in srgb,var(--pri) 35%,var(--line));background:color-mix(in srgb,var(--pbg) 55%,var(--card2));border-radius:14px;padding:12px;display:grid;gap:8px}
.id-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--pbg) 70%,var(--card)),var(--card2));display:grid;gap:10px}
.exp-box{border:1px solid rgba(225,29,72,.35);background:var(--Ab);color:var(--ink);border-radius:14px;padding:14px;display:grid;gap:8px}

.mob-dots-wrap{display:none;position:relative}
.mob-dots-btn{width:36px;min-height:36px;padding:0;border-radius:10px;font-size:19px;line-height:1}
.mob-dots-menu{position:absolute;top:calc(100% + 6px);right:0;width:210px;max-height:78dvh;overflow-y:auto;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-lg);padding:6px;display:grid;gap:2px;z-index:30;animation:popIn .16s ease}
.mob-dots-menu button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.mob-dots-menu button:hover{background:var(--pbg);color:var(--pri)}
.mob-dots-menu button.on{background:var(--pbg);color:var(--pri);font-weight:700}
.mob-dots-menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

@media (max-width:860px){
  h1{font-size:18px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:8px 12px;gap:6px;flex-wrap:wrap}
  .top .sync{font-size:10.5px;padding:3px 8px}
  .top input{order:10;flex:1 1 100%;width:100%;padding:8px 10px;font-size:13.5px}
  .top .rl,.top .chip .role{display:none}
  .top .chip{padding:2px;border:0;background:none}
  .top .b.sm{padding:6px 9px;min-height:34px;font-size:12px}
  .mob-dots-wrap{display:inline-flex;align-items:center}
  main{padding:12px;padding-bottom:28px}
  .card{padding:14px;border-radius:14px}
  .kp{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kp .card{padding:12px}
  .kp .card b{font-size:20px}
  .g2{grid-template-columns:minmax(0,1fr);gap:12px}
  .bar{gap:6px}
  .bar > input,.bar > select{flex:1 1 100%;width:100%}
  .bar > button,.bar > a.b{flex:1 1 calc(50% - 6px);min-width:0;padding:8px 10px;font-size:12.5px}
  .row{padding:10px 12px;gap:8px}
  .row .nm{flex:1 1 100%;min-width:0}
  .seg{width:100%;justify-content:space-between}
  .seg button{flex:1;height:40px;width:auto}
}
@media print{#bg-fx,#cursor-fx{display:none!important}.side,.top,.bar,.mob-dots-wrap,.noprint{display:none!important}.shell{display:block}body{background:#fff}}
</style>

function trialDaysElapsed(claimedAt){
 if(!claimedAt)return 0;
 const start=new Date(claimedAt).getTime();
 if(!start)return 0;
 return Math.max(0,Math.floor((Date.now()-start)/86400000));
}

function isTrialExpiredOrRemoved(email,ip){
 const em=(email||'').toLowerCase();
 if(em&&db.revokedTrials&&db.revokedTrials['email:'+em])return 'removed';
 if(ip&&db.revokedTrials&&db.revokedTrials['ip:'+ip])return 'removed';
 const limit=Number(db.trialDays)||7;
 const info=(ip&&db.trialClaimedIps&&db.trialClaimedIps[ip])||null;
 if(info&&info.claimedAt&&trialDaysElapsed(info.claimedAt)>=limit)return 'expired';
 return '';
}

function readPhotoFile(file,cb,maxSide=240){
 if(!file||!file.type.startsWith('image/')){toast('Please select an image file');return}
 const reader=new FileReader();
 reader.onload=ev=>{
  const img=new Image();
  img.onload=()=>{
   let w=img.width,h=img.height;
   if(w>h&&w>maxSide){h=Math.round(h*maxSide/w);w=maxSide}
   else if(h>=w&&h>maxSide){w=Math.round(w*maxSide/h);h=maxSide}
   const cv=document.createElement('canvas');
   cv.width=w;cv.height=h;
   const ctx=cv.getContext('2d');
   ctx.drawImage(img,0,0,w,h);
   cb(cv.toDataURL('image/jpeg',0.82));
  };
  img.src=ev.target.result;
 };
 reader.readAsDataURL(file);
}

let curTarget={x:-400,y:-400,active:false},curPos={x:-400,y:-400},ringPos={x:-400,y:-400};
function syncCursorFx(){
 const wrap=$('#cursor-fx');
 if(!wrap){return}
 if(!S.u){wrap.innerHTML='';return}
 if(!wrap.children.length){wrap.innerHTML='<div class="cur-aura"></div><div class="cur-ring"></div>'}
}
document.addEventListener('pointermove',e=>{
 if(e.pointerType!=='mouse'||!S.u)return;
 curTarget.x=e.clientX;
 curTarget.y=e.clientY;
 if(!curTarget.active){curPos.x=e.clientX;curPos.y=e.clientY;ringPos.x=e.clientX;ringPos.y=e.clientY;curTarget.active=true}
 const aura=$('#cursor-fx .cur-aura'),ring=$('#cursor-fx .cur-ring');
 if(aura)aura.style.opacity='1';
 if(ring)ring.style.opacity='1';
},{passive:true});
document.addEventListener('pointerleave',()=>{
 curTarget.active=false;
 const aura=$('#cursor-fx .cur-aura'),ring=$('#cursor-fx .cur-ring');
 if(aura)aura.style.opacity='0';
 if(ring)ring.style.opacity='0';
});
(function tickCursor(){
 if(S.u && curTarget.active){
  curPos.x+=(curTarget.x-curPos.x)*.16;
  curPos.y+=(curTarget.y-curPos.y)*.16;
  ringPos.x+=(curTarget.x-ringPos.x)*.09;
  ringPos.y+=(curTarget.y-ringPos.y)*.09;
  const aura=$('#cursor-fx .cur-aura'),ring=$('#cursor-fx .cur-ring');
  if(aura)aura.style.transform=`translate3d(${curPos.x.toFixed(1)}px,${curPos.y.toFixed(1)}px,0)`;
  if(ring)ring.style.transform=`translate3d(${ringPos.x.toFixed(1)}px,${ringPos.y.toFixed(1)}px,0)`;
 }
 requestAnimationFrame(tickCursor);
})();

async function loadCloud(silent=false){
 if(!sb)return;
 try{
  const {data,error}=await sb.from('app_state').select('data').eq('id',ROW_ID).single();
  if(error)throw error;
  if(data&&data.data){
   db=data.data;
   normalizeDb();
   applyAccent();
   enforceRemoteLock();
   document.title=`${orgName()} — Attendance`;
   try{localStorage.setItem(STORE_KEY,JSON.stringify(db))}catch(e){}
   syncStatus='Live synced';
   if(!silent)render(false);
  }
 }catch(err){
  syncStatus='Sync error';
  if(!silent)toast('Cloud sync error: check Supabase table/key');
 }
}

async function persist(){
 applyAccent();
 document.title=`${orgName()} — Attendance`;
 try{localStorage.setItem(STORE_KEY,JSON.stringify(db))}catch(e){}
 if(!sb)return;
 syncStatus='Saving...';
 try{
  const {error}=await sb.from('app_state').upsert({id:ROW_ID,data:db,updated_at:new Date().toISOString()});
  if(error)throw error;
  syncStatus='Live synced';
 }catch(err){
  syncStatus='Sync error';
  toast('Failed to save to cloud');
 }
}

function subscribeRealtime(){
 if(!sb)return;
 sb.channel('live_'+ROW_ID)
  .on('postgres_changes',{event:'*',schema:'public',table:'app_state',filter:`id=eq.${ROW_ID}`},payload=>{
   if(payload.new&&payload.new.data){
    db=payload.new.data;
    normalizeDb();
    applyAccent();
    enforceRemoteLock();
    document.title=`${orgName()} — Attendance`;
    try{localStorage.setItem(STORE_KEY,JSON.stringify(db))}catch(e){}
    syncStatus='Live synced';
    if(!dirty())render(false);
   }
  })
  .subscribe();
}

const bOf=id=>db.bat.find(b=>b.id===id),sOf=id=>db.stu.find(s=>s.id===id),tOf=id=>db.tch.find(t=>t.id===id);
const mine=()=>!S.u?[]:canManage(S.u.role)?db.bat:S.u.role==='teacher'?db.bat.filter(b=>b.teacher===S.u.ref):[bOf((sOf(S.u.ref)||{}).b)].filter(Boolean);
const myStu=()=>{const ids=mine().map(b=>b.id);return db.stu.filter(s=>ids.includes(s.b))};
function recs(sid,from='0000',to='9999'){const s=sOf(sid),o=[];if(!s)return o;for(const d in db.att){if(d<from||d>to)continue;const ses=db.att[d][s.b];if(ses&&ses.rec[sid])o.push({d,...ses.rec[sid],sub:ses.subject})}return o.sort((a,b)=>a.d<b.d?-1:1)}
const pctOf=a=>{const x=a.filter(r=>r.s!=='V');return x.length?Math.round(x.filter(r=>r.s==='P'||r.s==='L').length/x.length*100):null};
const streak=a=>{let n=0;for(let i=a.length-1;i>=0&&a[i].s==='A';i--)n++;return n};
function dayC(d,ids){const c={P:0,A:0,L:0,V:0};ids.forEach(b=>{const s=db.att[d]&&db.att[d][b];if(s)Object.values(s.rec).forEach(r=>c[r.s]++)});c.n=c.P+c.A+c.L;c.pct=c.n?Math.round((c.P+c.L)/c.n*100):null;return c}
const risk=()=>myStu().map(s=>({s,p:pctOf(recs(s.id)),th:(bOf(s.b)||{}).th||75})).filter(x=>x.p!==null&&x.p<x.th).sort((a,b)=>a.p-b.p);

    if(db.att[d][b]&&db.att[d][b].rec&&db.att[d][b].rec[id])delete db.att[d][b].rec[id];
   }
  }
  for(const m in db.fees){
   if(db.fees[m]&&db.fees[m][id])delete db.fees[m][id];
  }
  S.selectedFeeIds=(S.selectedFeeIds||[]).filter(x=>x!==id);
  if(S.dr&&S.dr.rec&&S.dr.rec[id])delete S.dr.rec[id];
  if(S.drawerId===id)closeDr();
  await persist();
  render(false);
  toast('Student removed');
 });

async function checkExpiryOnLoad(){
 if(db.appLocked && (!S.u || S.u.role!=='owner'))return;
 let ip='';
 try{ip=await fetchPublicIp()}catch(e){}
 const adminEm=(db.admin&&db.admin.email||'').toLowerCase();
 const reason=isTrialExpiredOrRemoved(adminEm,ip);
 if(reason){
  if(S.u && S.u.role!=='owner'){
   S.u=null;
   saveSession(null);
   render(false);
  }
  const msg=reason==='expired'?'Aapka 1 week / trial khatam ho gaya hai.':'Aapka trial access khatam/remove kar diya gaya hai.';
  if(db.autoSubMsg && db.clientPhone){
   const ren=waClientRenewal();
   if(ren.intl){
    try{window.open(ren.url,'_blank','noopener')}catch(e){}
   }
  }
  if(!S.expiredShownOnce){
   S.expiredShownOnce=true;
   showTrialExpiredPopup(msg);
  }
 }
}

  }
 }
 else if(a==='addB'){modal('Create new batch',`<div class="fl"><label>Batch name<input id="bn" placeholder="e.g. Matric Science"></label><label>Class timing<input id="bt" placeholder="e.g. 16:00–18:00"></label><label>Assigned teacher<select id="btea"><option value="">Unassigned</option>${db.tch.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label><label>Minimum attendance (%)<input id="bth" type="number" min="50" max="100" value="75"></label><label>Subjects (comma separated)<input id="bsub" value="Math, Physics, Chemistry"></label></div>`,'Create batch',async()=>{const name=val('bn').trim();if(!name){toast('Batch name is required');return false}const subs=val('bsub').split(',').map(x=>x.trim()).filter(Boolean);db.bat.push({id:'b'+Date.now(),name,time:val('bt').trim()||'16:00–18:00',teacher:val('btea'),th:Math.min(100,Math.max(50,Number(val('bth'))||75)),subs:subs.length?subs:['General']});await persist();render(false);toast('Batch created')})}
 else if(a==='delB'){
  const b=bOf(id);if(!b)return;
  modal('Delete batch?',`<p class="mut">Delete <b>${esc(b.name)}</b>? Assigned students will stay in database without this batch.</p>`,'Delete',async()=>{
   db.bat=db.bat.filter(x=>x.id!==id);
   for(const d in db.att){if(db.att[d]&&db.att[d][id])delete db.att[d][id]}
   if(S.b===id)S.b='';
   await persist();render(false);toast('Batch deleted');
  });
 }
 else if(a==='addT'){modal('Add teacher',`<div class="fl"><label>Full name<input id="tn" placeholder="e.g. Sir Kamran"></label><label>Email<input id="te" type="email" placeholder="kamran@ourcoaching.pk"></label><label>Password<input id="tpw" type="text" value="teach123"></label></div>`,'Add teacher',async()=>{const name=val('tn').trim(),email=val('te').trim();if(!name||!email){toast('Name and email are required');return false}db.tch.push({id:'t'+Date.now(),name,email,pw:val('tpw').trim()||'teach123',photo:''});await persist();render(false);toast('Teacher added')})}
 else if(a==='delT'){
  const t=tOf(id);if(!t)return;
  modal('Remove teacher?',`<p class="mut">Remove <b>${esc(t.name)}</b> from teachers?</p>`,'Remove',async()=>{
   db.tch=db.tch.filter(x=>x.id!==id);
   db.bat.forEach(b=>{if(b.teacher===id)b.teacher=''});
   await persist();render(false);toast('Teacher removed');
  });
 }
 else if(a==='csv'){const blob=new Blob([csv()],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`${orgName().toLowerCase().replace(/\W+/g,'-')}-attendance-${range()[0]}-to-${range()[1]}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV exported')}
 else if(a==='backupJson'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`${orgName().toLowerCase().replace(/\W+/g,'-')}-backup-${TODAY}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded')}
 else if(a==='restoreJson'){modal('Restore backup JSON','<p class="mut sm">Paste a previously exported JSON backup to restore data.</p><textarea id="jrestore" placeholder=\'{"bat":...}\'></textarea>','Restore',async()=>{try{const parsed=JSON.parse(val('jrestore'));if(!parsed||!Array.isArray(parsed.bat)||!Array.isArray(parsed.stu))throw 0;db=parsed;normalizeDb();applyAccent();await persist();render(false);toast('Backup restored')}catch(err){toast('Invalid JSON backup');return false}})}
 else if(a==='print'){window.print()}
});

document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='q'||el.id==='gq'){S.q=el.value;const pos=el.selectionStart;render(false);const nx=$('#'+el.id);if(nx){nx.focus();if(pos!=null)nx.setSelectionRange(pos,pos)}}
 else if(el.dataset.f==='m'&&S.dr){const id=el.dataset.id;if(S.dr.rec[id])S.dr.rec[id].m=el.value}
});

document.addEventListener('change',async e=>{
 const el=e.target,f=el.dataset.f;if(!f)return;
 if(f==='b'){guard(()=>{S.b=el.value;openDraft();render(false)})}
 else if(f==='sub'&&S.dr){S.dr.subject=el.value;render(false)}
 else if(f==='d'){guard(()=>{S.d=el.value||TODAY;openDraft();render(false)})}
 else if(f==='f'){S.f=el.value;render(false)}
 else if(f==='rb'){S.rb=el.value;render(false)}
 else if(f==='rf'){S.rf=el.value;render(false)}
 else if(f==='rp'){S.rp=el.value;render(false)}
 else if(f==='from'){S.from=el.value;render(false)}
 else if(f==='to'){S.to=el.value;render(false)}
 else if(f==='feeMonth'){S.feeMonth=el.value||curMonth();render(false)}
 else if(f==='feeFilter'){S.feeFilter=el.value;render(false)}
 else if(f==='feeSelAll'){
  const m=S.feeMonth||curMonth(),q=S.q.toLowerCase();
  const ids=db.stu.filter(s=>{const fc=getFee(s.id,m);return(!S.rb||s.b===S.rb)&&(!S.feeFilter||fc.status===S.feeFilter)&&(!q||s.name.toLowerCase().includes(q)||s.roll.toLowerCase().includes(q))}).map(x=>x.id);
  S.selectedFeeIds=el.checked?ids:[];
  render(false);
 }
 else if(f==='feeSelOne'){
  const sid=el.dataset.id;
  if(!sid)return;
  const cur=new Set(S.selectedFeeIds||[]);
  if(el.checked)cur.add(sid);else cur.delete(sid);
  S.selectedFeeIds=Array.from(cur);
  render(false);
 }
 else if(f==='bt'){const b=bOf(el.dataset.id);if(b){b.time=el.value;await persist();toast('Timing updated')}}
 else if(f==='bte'){const b=bOf(el.dataset.id);if(b){b.teacher=el.value;await persist();render(false);toast('Teacher assigned')}}
 else if(f==='bth'){const b=bOf(el.dataset.id);if(b){b.th=Math.min(100,Math.max(50,Number(el.value)||75));await persist();render(false);toast('Threshold updated')}}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();closeDr();if(S.mobMenuOpen){S.mobMenuOpen=false;render(false)}}});

/* =========================================================
   COACHING CLIENT CONFIG (Har naye client ke liye sirf ye badlein)
   Misal: '1 coaching' -> '2 coaching' -> '3 coaching'
========================================================= */
const COACHING_ID = '1 coaching';

ROW_ID = COACHING_ID.trim().toLowerCase().replace(/\s+/g, '_');
STORE_KEY = 'att_db_' + ROW_ID;
SESSION_KEY = 'att_sess_' + ROW_ID;

db = (()=>{try{return JSON.parse(localStorage.getItem(STORE_KEY))}catch(e){return null}})() || emptyDb();
normalizeDb();
applyAccent();
S.tempAccent = db.accent;
S.tempLogo = db.orgLogo || '';
S.u = (()=>{try{return JSON.parse(localStorage.getItem(SESSION_KEY))}catch(e){return null}})();

subscribeRealtime();
render(true);
loadCloud(true).then(()=>checkExpiryOnLoad());
</script>
</body>
</html>
